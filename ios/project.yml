name: COACH
options:
  bundleIdPrefix: com.coach
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  COACH:
    type: application
    platform: iOS
    sources:
      - path: COACH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coach.mojaaplikacija
        PRODUCT_NAME: COACH
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: COACH/Info.plist
    info:
      path: COACH/Info.plist
      properties:
        CFBundleDisplayName: COACH
        CFBundleDevelopmentRegion: hr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts: [display.ttf]
        UILaunchScreen: {}
        # the header is dark in both themes: the clock and battery are always drawn white
        UIViewControllerBasedStatusBarAppearance: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIDesignRequiresCompatibility: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
