name: iOS

on:
  push:
    branches: [ios, ios-dev]
    paths: ['ios/**', '.github/workflows/ios.yml']

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          ls /Applications | grep Xcode
          # App Store Connect only accepts builds made with the iOS 26 SDK (Xcode 26) or later
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Generate project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (simulator)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project COACH.xcodeproj -scheme COACH -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 \
            || { grep -E "error:|warning: .*will be an error" build.log | sort -u | head -80; tail -30 build.log; exit 1; }
          grep -c "warning:" build.log || true

      - name: Screenshots (demo data)
        continue-on-error: true
        working-directory: ios
        run: |
          set -x
          # a 6.9" Pro Max gives 1320x2868, the size App Store Connect asks for
          DEV=$(xcrun simctl list devices available | grep -E "iPhone 1[67] Pro Max \(" | tail -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          [ -z "$DEV" ] && DEV=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl status_bar "$DEV" override --time 9:41 --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$DEV" build/Build/Products/Debug-iphonesimulator/COACH.app
          mkdir -p shots shots/dark shots/store
          ALL="login training gym track progress series comp board podium settings c-plan c-session c-edit c-log c-athletes c-athlete c-board c-more c-boards c-comps c-comp c-settings"
          shot() { # name, folder, extra launch arguments
            xcrun simctl terminate "$DEV" com.coach.mojaaplikacija || true
            xcrun simctl launch "$DEV" com.coach.mojaaplikacija -shot $1 $3
            sleep 6
            xcrun simctl io "$DEV" screenshot "shots/$2$1.png"
          }
          for s in $ALL; do shot $s "" ""; done
          # the same screens in the dark theme ("-dark YES" lands in UserDefaults)
          for s in $ALL; do shot $s "dark/" "-dark YES"; done
          # App Store set: same demo data, no DEMO tag or role switch
          for s in training gym track series comp board podium progress c-plan c-session c-log c-athlete c-comps c-boards; do shot $s "store/" "-store"; done

      - name: Publish screenshots to branch ios-shots
        if: always()
        working-directory: ios
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b ios-shots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "screenshots ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ios-shots

      - name: TestFlight
        # only the ios branch ships; ios-dev builds and takes screenshots
        if: env.ASC_KEY_ID != '' && github.ref == 'refs/heads/ios'
        working-directory: ios
        run: |
          set -o pipefail
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          pip3 install --break-system-packages pyjwt cryptography >/dev/null 2>&1 || pip3 install pyjwt cryptography >/dev/null
          python3 ci/register_bundle.py com.coach.mojaaplikacija
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $HOME/private_keys/AuthKey_$ASC_KEY_ID.p8 -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -project COACH.xcodeproj -scheme COACH -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/COACH.xcarchive DEVELOPMENT_TEAM=$APPLE_TEAM_ID CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} archive > archive.log 2>&1 \
            || { grep -E "error:" archive.log | sort -u | head -60; tail -40 archive.log; exit 1; }
          # the archive is unsigned (no devices = no development profile); export signs it for the App Store
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" ExportOptions.plist
          if [ -f no_app ]; then /usr/libexec/PlistBuddy -c "Set :destination export" ExportOptions.plist; fi
          xcodebuild -exportArchive -archivePath build/COACH.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export $AUTH > export.log 2>&1 \
            || { grep -iE "error" export.log | sort -u | head -40; tail -30 export.log; exit 1; }
          tail -15 export.log
          ls -la build/export || true
          if [ -f no_app ]; then echo "::warning::Signed for the App Store. Upload skipped: create the app in App Store Connect first."; fi
